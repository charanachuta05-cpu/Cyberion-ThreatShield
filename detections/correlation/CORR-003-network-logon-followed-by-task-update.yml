title: Network Logon Followed by Scheduled Task Modification
id: e908a308-1125-48c4-86a9-f73c71130303
status: experimental
description: >
  Detects a successful Windows network logon followed shortly by modification
  of a scheduled task on the same host. Behavioral validation additionally
  verifies that the scheduled-task event SubjectLogonId corresponds to the
  successful logon's TargetLogonId.
author: Cyberion ThreatShield
date: 2026-09-09
tags:
  - attack.t1053.005
correlation:
  type: temporal_ordered
  rules:
    - threatshield_corr003_network_logon
    - threatshield_corr003_task_updated
  group-by:
    - Computer
  timespan: 1m
level: high
