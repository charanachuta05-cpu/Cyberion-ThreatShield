title: Scheduled Task Created Then Rapidly Deleted
id: 67e7750e-c424-42a7-8706-a124587b1002
status: experimental
description: >
  Detects creation of a Windows scheduled task followed by deletion of
  the same task within one minute. Rapid task creation and removal can
  warrant investigation because short-lived scheduled tasks may be used
  for transient execution while reducing persistent artifacts.
references:
  - https://github.com/0xT11/EVTX-ATTACK-SAMPLES
author: Cyberion ThreatShield
date: 2026-09-09
tags:
  - attack.t1053.005
correlation:
  type: temporal_ordered
  rules:
    - threatshield_corr002_task_created
    - threatshield_corr002_task_deleted
  group-by:
    - TaskName
    - SubjectUserName
  timespan: 1m
falsepositives:
  - Legitimate administrative automation that creates temporary tasks
  - Software installation or update workflows
  - Endpoint-management tooling using short-lived scheduled tasks
level: medium
