title: Kerberos Password Spray Indicators Across Multiple Accounts
name: threatshield_kerberos_auth_failures
id: 6e928b04-99bb-4535-bd82-bf4b858c7404
status: experimental
description: >
  Detects Kerberos authentication failures associated with invalid
  accounts or incorrect pre-authentication information. Multiple
  failures from a common source across distinct accounts should be
  correlated as possible password-spraying activity.
references:
  - https://github.com/0xT11/EVTX-ATTACK-SAMPLES
author: Cyberion ThreatShield
date: 2026-09-09
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection_4768:
    EventID: 4768
    Status: '0x00000006'
  selection_4771:
    EventID: 4771
    Status: '0x00000018'
  condition: selection_4768 or selection_4771
falsepositives:
  - Users entering incorrect passwords
  - Stale credentials in services or scheduled processes
  - Authentication problems after password changes
level: medium
