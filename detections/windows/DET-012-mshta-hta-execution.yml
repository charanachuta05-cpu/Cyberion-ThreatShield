title: MSHTA Executing HTA Content
id: 02df6b25-fd18-4519-b9f5-f4af71131202
status: experimental
description: >
  Detects mshta.exe process creation where the command line references
  HTA content. This may identify suspicious use of the Microsoft HTML
  Application Host.
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: Cyberion ThreatShield
date: 2026-09-09
tags:
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\mshta.exe'
  selection_command:
    CommandLine|contains: '.hta'
  condition: selection_image and selection_command
falsepositives:
  - Legitimate enterprise HTA applications
  - Administrative scripts intentionally launched through mshta.exe
level: medium
